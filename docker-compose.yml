services:
  db:
    image: postgres:15-alpine
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # These match the original development Compose defaults so an existing
      # ./postgres/data cluster remains usable after an image rebuild.
      POSTGRES_DB: ${PGDB_NAME:-postgres}
      POSTGRES_USER: ${PGDB_USER:-postgres}
      POSTGRES_PASSWORD: ${PGDB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGDB_USER:-postgres} -d ${PGDB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    env_file:
      - path: ./.env
        required: false
    build:
      context: .
      dockerfile: ./dockerfiles/dev/Django/Dockerfile
    volumes:
      - ./core:/usr/src/app
    working_dir: /usr/src/app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_ENGINE: django.db.backends.postgresql
      PGDB_NAME: ${PGDB_NAME:-postgres}
      PGDB_USER: ${PGDB_USER:-postgres}
      PGDB_PASSWORD: ${PGDB_PASSWORD:-postgres}
      PGDB_HOST: db
      PGDB_PORT: 5432
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: smtp4dev
      EMAIL_PORT: 25
      SHOW_DEBUGGER_TOOLBAR: ${SHOW_DEBUGGER_TOOLBAR:-True}
      MERCHANT_ID: ${MERCHANT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      smtp4dev:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - "5000:80" # Web UI
      - "25:25" # SMTP
      - "143:143" # IMAP
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

volumes:
  smtp4dev-data:
